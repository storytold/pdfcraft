[package]
name = "pdfcraft-cli"
description = "PdfCraft command-line tool: inspect, render, view and robustness-check PDFs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pdfcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
pdfcraft-render = { workspace = true }
serde_json = { workspace = true }
pdfcraft-engine = { workspace = true }
pdfcraft-audit = { workspace = true }
pdfcraft-cos = { workspace = true }
pdfcraft-preflight = { workspace = true }
pdfcraft-automation = { workspace = true }
pdfcraft-platform = { workspace = true }
base64 = "0.23"

[dev-dependencies]
# Decodes `render` output in tests/it/owner_password.rs; already a dependency of the engine.
png = "0.18"
proptest = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `geteuid` for `ui`'s control-file owner check, and the terminal's size and raw mode for `view`
# (`termios`): safe, so no `unsafe` libc call here.
# Already in Cargo.lock through the GUI crates.
rustix = { version = "1", features = ["process", "termios"] }

[build-dependencies]
# VERSIONINFO for pdfcraft-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[features]
default = ["mcp"]
# The opt-in MCP server (`pdfcraft-cli mcp`). Build with --no-default-features to leave it out.
mcp = ["pdfcraft-automation/mcp"]
