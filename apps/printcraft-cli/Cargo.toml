[package]
name = "printcraft-cli"
description = "PrintCraft command-line tool: inspect, render and robustness-check PDFs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "printcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
printcraft-render = { workspace = true }
serde_json = { workspace = true }
printcraft-engine = { workspace = true }
printcraft-cos = { workspace = true }
printcraft-audit = { workspace = true }
printcraft-automation = { workspace = true }
base64 = "0.22"

[features]
default = ["mcp"]
# The opt-in MCP server (`printcraft-cli mcp`). Build with --no-default-features to leave it out.
mcp = ["printcraft-automation/mcp"]
