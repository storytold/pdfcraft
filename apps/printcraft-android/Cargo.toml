[package]
name = "printcraft-android"
description = "PrintCraft on Android: eframe + wgpu shell on GameActivity, reusing the desktop engine and egui UI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The workspace forbids `unsafe`; the Android entry point needs `#[unsafe(no_mangle)]` and JNI
# needs `JavaVM::from_raw`, so this crate follows the `crates/platform` pattern: `deny`, with
# `#[allow(unsafe_code)]` on the entry point and on the JNI helpers, each with a `// SAFETY:` note.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"

[lib]
# `android.app.lib_name=main` in the manifest loads this cdylib.
name = "main"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
pdfcraft-ui-egui = { workspace = true }
pdfcraft-render = { workspace = true }
egui = { workspace = true }
jni = "0.22"
ndk-context = "0.1"
eframe = { workspace = true, default-features = false, features = [
    "default_fonts",
    "wgpu",
    "android-game-activity",
] }
winit = { version = "0.30", default-features = false }
log = { workspace = true }
android_logger = "0.15"
