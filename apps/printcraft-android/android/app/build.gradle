plugins {
    id 'com.android.application'
}

android {
    compileSdk = 35

    defaultConfig {
        applicationId = "ai.storyteller.printcraft"
        minSdk = 31
        targetSdk = 35
        versionCode = 1
        versionName = "0.13.0"
    }

    sourceSets {
        main {
            // Where cargo-ndk writes the .so (cargo ndk -o apps/printcraft-android/jniLibs)
            jniLibs.srcDirs = ['../../jniLibs']
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            // Debug signing so the release APK installs with a plain `adb install -r`
            signingConfig = signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace = 'ai.storyteller.printcraft'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation "androidx.games:games-activity:4.4.0"
}
