org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Rust library's ABIs: arm64-v8a for phones, x86_64 for the emulator. Build one to save time,
# e.g. `./gradlew installRelease -Ppdfcraft.abis=arm64-v8a`.
pdfcraft.abis=arm64-v8a,x86_64

# The app's version and its version code (before the ABI digit: see app/build.gradle.kts, the build
# checks the two agree). Set both to the release's before tagging it: the release workflow refuses a
# tag that differs, and F-Droid's update check reads them from here.
pdfcraft.version=0.0.6-beta
pdfcraft.versionCode=601
