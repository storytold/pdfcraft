<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PdfCraft</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <!-- Installable app (PWA): the manifest registers PdfCraft as a PDF handler, so an installed
         copy appears in the system's "Open with" list; src/main.rs (`launch_queue`) opens the files. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/scalable/apps/ai.storyteller.pdfcraft.svg" type="image/svg+xml" />
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link data-trunk rel="copy-dir" href="../../assets/app-icon/hicolor" data-target-path="icons" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f1f1f3; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      @media (prefers-color-scheme: dark) { html, body { background: #19191c; } }
    </style>
  </head>
  <body>
    <canvas id="pdfcraft"></canvas>
  </body>
</html>
