<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PdfCraft</title>
    <!-- The page is the app that speaks the host bridge: `data-cargo-features`
         turns on `collab` for this asset only (the OCR worker below has no such
         feature). Without it the page never answers `pdfcraft:session` and the
         cabinet's room is never dialled (D4); the crate feature stays off by
         default, so `cargo build`/`cargo test` are single-user as before. -->
    <link data-trunk rel="rust" data-wasm-opt="z" data-cargo-features="collab" />
    <!-- Recognises text off the page's thread (crates/ui-egui/src/workflows/ocr_web.rs). -->
    <link data-trunk rel="rust" href="../pdfcraft-ocr-worker/Cargo.toml" data-type="worker" data-loader-shim data-bindgen-target="web" data-wasm-opt="3" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f1f1f3; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      @media (prefers-color-scheme: dark) { html, body { background: #19191c; } }
    </style>
  </head>
  <body>
    <canvas id="pdfcraft"></canvas>
  </body>
</html>
