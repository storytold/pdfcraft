name: PdfCraftMobilePOC
options:
  minimumXcodeGenVersion: 2.46.0
  developmentLanguage: "${PDFCRAFT_APP_LANGUAGE}"
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    PDFCRAFT_APP_BUNDLE_ID: io.github.storytold.pdfcraft.poc
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "${PDFCRAFT_IOS_SHORT_VERSION}"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PdfCraftMobilePOC:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - PdfCraftMobilePOC
      - path: ../../NOTICE
        buildPhase: resources
      - path: ../../LICENSE-MIT
        buildPhase: resources
      - path: ../../LICENSE-APACHE
        buildPhase: resources
      - path: ../../assets/app-icon/LICENSE.txt
        buildPhase: resources
      - path: ../../target/ios/Generated
        excludes: ["*.h"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(PDFCRAFT_APP_BUNDLE_ID)"
        SWIFT_OBJC_BRIDGING_HEADER: PdfCraftMobilePOC/Bridge.h
        INFOPLIST_FILE: ../../target/ios/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../../target/ios/Generated"
        INFOPLIST_KEY_CFBundleDisplayName: "${PDFCRAFT_APP_DISPLAY_NAME}"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  PdfCraftMobilePOCUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PdfCraftMobilePOCUITests]
    dependencies:
      - target: PdfCraftMobilePOC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(PDFCRAFT_APP_BUNDLE_ID).uitests"
        TEST_TARGET_NAME: PdfCraftMobilePOC
  PdfCraftMobilePOCTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PdfCraftMobilePOCTests]
    dependencies:
      - target: PdfCraftMobilePOC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(PDFCRAFT_APP_BUNDLE_ID).tests"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../../target/ios/Generated"
schemes:
  PdfCraftMobilePOC:
    build:
      targets:
        PdfCraftMobilePOC: all
    test:
      targets: [PdfCraftMobilePOCTests, PdfCraftMobilePOCUITests]
