name: PdfCraftMobilePOC
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PdfCraftMobilePOC:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - PdfCraftMobilePOC
      - path: ../../target/ios/Generated
        excludes: ["*.h"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blackoutsecure.pdfcraft.poc
        SWIFT_OBJC_BRIDGING_HEADER: PdfCraftMobilePOC/Bridge.h
        INFOPLIST_FILE: Config/Info.plist
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../../target/ios/Generated"
        INFOPLIST_KEY_CFBundleDisplayName: PdfCraftMobilePOC
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  PdfCraftMobilePOCUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PdfCraftMobilePOCUITests]
    dependencies:
      - target: PdfCraftMobilePOC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blackoutsecure.pdfcraft.poc.uitests
        TEST_TARGET_NAME: PdfCraftMobilePOC
  PdfCraftMobilePOCTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PdfCraftMobilePOCTests]
    dependencies:
      - target: PdfCraftMobilePOC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blackoutsecure.pdfcraft.poc.tests
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../../target/ios/Generated"
schemes:
  PdfCraftMobilePOC:
    build:
      targets:
        PdfCraftMobilePOC: all
    test:
      targets: [PdfCraftMobilePOCTests, PdfCraftMobilePOCUITests]
