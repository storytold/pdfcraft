[package]
name = "pdfcraft-gtk"
description = "Native GNOME frontend for PdfCraft, built with GTK4 and libadwaita"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pdfcraft-gtk"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
pdfcraft-engine = { workspace = true }
pdfcraft-automation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
gtk4 = { version = "0.11", features = ["v4_22"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
