[workspace]
members = [
    "crates/preflight_engine",
    "crates/iso_standards",
    "crates/optimizer",
    "crates/linearizer",
    "crates/print_production",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PdfCraft Core Team"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
