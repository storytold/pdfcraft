[workspace]
members = [
    "crates/pdf_ua_remediation",
    "crates/action_wizard",
    "crates/universal_cli",
    "crates/platform_readiness",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PdfCraft Core Team"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
