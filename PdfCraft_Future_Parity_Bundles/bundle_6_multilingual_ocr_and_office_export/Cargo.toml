[workspace]
members = [
    "crates/scan_cleanup",
    "crates/multilingual_ocr",
    "crates/office_export",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PdfCraft Core Team"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
