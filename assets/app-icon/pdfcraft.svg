<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#01131C"/>
      <stop offset="55%" stop-color="#082032"/>
      <stop offset="100%" stop-color="#0F2D4A"/>
    </linearGradient>
    <linearGradient id="page" x1="258" y1="184" x2="758" y2="836" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F6F9"/>
    </linearGradient>
    <linearGradient id="linkcoRed" x1="210" y1="240" x2="680" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F22424"/>
      <stop offset="100%" stop-color="#D11616"/>
    </linearGradient>
  </defs>

  <!-- Linkco Deep Navy (#01131C) rounded icon tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="#F22424" stroke-opacity="0.38" stroke-width="8"/>

  <!-- Subtle document drop shadow -->
  <path d="M312 204 H622 L766 348 V810 A44 44 0 0 1 722 854 H312 A44 44 0 0 1 268 810 V248 A44 44 0 0 1 312 204 Z" fill="#00080D" fill-opacity="0.48"/>

  <!-- Main PDF document sheet -->
  <path d="M302 188 H612 L756 332 V794 A44 44 0 0 1 712 838 H302 A44 44 0 0 1 258 794 V232 A44 44 0 0 1 302 188 Z" fill="url(#page)"/>

  <!-- Folded top-right corner -->
  <path d="M612 188 V294 A38 38 0 0 0 650 332 H756 Z" fill="#CBD5E1"/>

  <!-- Official Linkco (linkco.com.qa / Al Rawabet) 4-Node Connected Network Emblem in #F22424 -->
  <g stroke="#F22424" stroke-width="22" stroke-linecap="round">
    <!-- Link from center hub (486, 426) to top-left node (424, 276) -->
    <line x1="486" y1="426" x2="424" y2="276"/>
    <!-- Link from center hub (486, 426) to right node (648, 426) -->
    <line x1="486" y1="426" x2="648" y2="426"/>
    <!-- Link from center hub (486, 426) to bottom-left node (362, 494) -->
    <line x1="486" y1="426" x2="362" y2="494"/>
  </g>
  <!-- 4 Linkco Emblem Nodes -->
  <circle cx="486" cy="426" r="64" fill="url(#linkcoRed)"/>
  <circle cx="424" cy="276" r="46" fill="url(#linkcoRed)"/>
  <circle cx="648" cy="426" r="38" fill="url(#linkcoRed)"/>
  <circle cx="362" cy="494" r="28" fill="url(#linkcoRed)"/>

  <!-- Linkco Red (#F22424) PDF Ribbon Banner -->
  <rect x="214" y="576" width="496" height="152" rx="30" fill="url(#linkcoRed)"/>

  <!-- Crisp vector 'PDF' monogram in white inside the Linkco Red banner -->
  <!-- P -->
  <path fill-rule="evenodd" d="M276 608 H334 A36 36 0 0 1 370 644 A36 36 0 0 1 334 680 H304 V706 H276 Z M304 631 V657 H332 A13 13 0 0 0 345 644 A13 13 0 0 0 332 631 Z" fill="#FFFFFF"/>
  <!-- D -->
  <path fill-rule="evenodd" d="M396 608 H446 A49 49 0 0 1 495 657 A49 49 0 0 1 446 706 H396 Z M424 631 V683 H444 A26 26 0 0 0 470 657 A26 26 0 0 0 444 631 Z" fill="#FFFFFF"/>
  <!-- F -->
  <path d="M522 608 H598 V631 H550 V649 H590 V672 H550 V706 H522 Z" fill="#FFFFFF"/>

  <!-- Linkco Navy footer bar on page -->
  <rect x="334" y="762" width="276" height="22" rx="11" fill="#01131C" fill-opacity="0.82"/>
  <rect x="630" y="762" width="72" height="22" rx="11" fill="#F22424"/>
</svg>
