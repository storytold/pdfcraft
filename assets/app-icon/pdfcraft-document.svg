<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">PdfCraft PDF document</title>
  <desc id="desc">Cream document with a mint folded corner, charcoal outline, teal text lines and deep-teal PDF badge.</desc>
  <defs>
    <linearGradient id="paperShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe9dc"/>
      <stop offset="1" stop-color="#efe9dc"/>
    </linearGradient>
  </defs>
  <!-- Document silhouette: original PdfCraft charcoal and cream palette -->
  <path d="M15.1 4.1H36.6c1.8 0 3.1.6 4.4 1.9l13.1 13.2c1.4 1.4 2 2.9 2 4.9v28.1c0 3.7-2.3 6-6 6H15.2c-3.8 0-6.1-2.3-6.1-6V10.2c0-3.8 2.3-6.1 6-6.1Z"
        fill="url(#paperShade)" stroke="#0b0b0c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mint folded corner -->
  <path d="M37.1 5.1v10.1c0 3.4 2 5.5 5.5 5.5h12.3L37.1 5.1Z" fill="#c8ece4"/>
  <path d="M37.1 5.1v10.1c0 3.4 2 5.5 5.5 5.5h12.3" fill="none" stroke="#0b0b0c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Teal document lines -->
  <g fill="none" stroke="#12a58a" stroke-width="1.65" stroke-linecap="round">
    <path d="M16.2 27.0H49.5"/>
    <path d="M16.2 31.0H49.5"/>
    <path d="M16.2 35.0H49.5"/>
    <path d="M16.2 39.0H49.5"/>
  </g>
  <!-- Original deep-teal PDF label -->
  <rect x="4.2" y="39.0" width="37.6" height="15.4" rx="2.15" fill="#087f6b" stroke="#0b0b0c" stroke-width="1.15" stroke-linejoin="round"/>
  <text x="22.9" y="50.55" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.7" font-weight="700" letter-spacing="0.08" fill="#ffffff">PDF</text>
</svg>
