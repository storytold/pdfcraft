name: Build Hebrew Windows MSI

on:
  push:
    branches:
      - feat/hebrew-ui-and-booklet-side-persistence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hebrew-windows-msi-${{ github.sha }}
  cancel-in-progress: true

jobs:
  windows-msi:
    name: Windows x64 Hebrew MSI
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RUST_BACKTRACE: 1
      PDFCRAFT_VERSION: "0.15.0-hebrew.1"
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"

    steps:
      - name: Check out PdfCraft
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the release-pinned font set
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts

      - name: Install Rust and the Windows target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: hebrew-msi-windows-x64

      - name: Install WiX 5.0.2 and MSI extensions
        uses: storytold/craft-common-actions/actions/install-wix@main
        with:
          wix-version: 5.0.2
          install-extensions: "true"

      - name: Verify the dedicated Hebrew build configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Select-String -Path 'crates/ui-egui/src/app.rs' -Pattern 'option_env!\("PDFCRAFT_DEFAULT_LANGUAGE"\)' -Quiet)) {
            throw 'The app no longer has the compile-time first-launch language setting.'
          }
          if (-not (Select-String -Path 'crates/ui-egui/src/i18n.rs' -Pattern 'code: "he".*name: "עברית".*rtl: true' -Quiet)) {
            throw 'Hebrew is not registered with right-to-left text direction.'
          }
          if (-not (Test-Path 'crates/ui-egui/src/i18n/he.tsv')) {
            throw 'The Hebrew translation catalog is missing.'
          }

      - name: Test UI library with Hebrew as the default language
        shell: pwsh
        env:
          PDFCRAFT_DEFAULT_LANGUAGE: he
        run: cargo test --locked -p pdfcraft-ui-egui --lib

      - name: Build, validate and package MSI
        shell: pwsh
        env:
          PDFCRAFT_DEFAULT_LANGUAGE: he
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PDFCRAFT_DEFAULT_LANGUAGE -ne 'he') {
            throw "Expected PDFCRAFT_DEFAULT_LANGUAGE=he, got '$env:PDFCRAFT_DEFAULT_LANGUAGE'."
          }
          ./packaging/windows/package.ps1 -Arch x64

      - name: Verify MSI signature and calculate SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $PWD 'dist/release/pdfcraft-0.15.0-hebrew.1-windows-x64.msi'
          if (-not (Test-Path -LiteralPath $msi)) {
            throw "Expected MSI was not created: $msi"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $msi
          if ($signature.Status -eq 'Valid') {
            Write-Host "MSI signature is valid: $($signature.SignerCertificate.Subject)"
          } elseif ($signature.Status -eq 'NotSigned') {
            Write-Warning "The MSI is structurally validated but unsigned; Windows may show a publisher warning."
          } else {
            throw "MSI signature validation failed: $($signature.Status) $($signature.StatusMessage)"
          }
          $hash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($msi))" |
            Set-Content -LiteralPath "$msi.sha256" -Encoding ascii
          $info = [ordered]@{
            product = 'PdfCraft Hebrew preview'
            version = '0.15.0-hebrew.1'
            architecture = 'x64'
            source_commit = $env:GITHUB_SHA
            font_catalog_commit = 'b076417b5880bd4154bd22f00695b1d28c6bea83'
            installer = [IO.Path]::GetFileName($msi)
            sha256 = $hash
            signature_status = [string]$signature.Status
          }
          $info | ConvertTo-Json | Set-Content -LiteralPath 'dist/release/pdfcraft-hebrew-build-info.json' -Encoding utf8
          Get-Item -LiteralPath $msi, "$msi.sha256" | Format-Table Name, Length
          Write-Host "SHA-256: $hash"

      - name: Upload the standalone MSI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PdfCraft-Hebrew-MSI-windows-x64
          path: |
            dist/release/pdfcraft-0.15.0-hebrew.1-windows-x64.msi
            dist/release/pdfcraft-0.15.0-hebrew.1-windows-x64.msi.sha256
            dist/release/pdfcraft-hebrew-build-info.json
          if-no-files-found: error
          retention-days: 30
