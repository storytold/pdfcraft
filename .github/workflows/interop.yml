name: Interop

# Opens every kind of output PdfCraft writes in MuPDF and Poppler (`cargo xtask interop`). It reports
# and is not a required check: a reader release can change what it accepts without a change here.
on:
  pull_request:
    paths:
      - ".github/workflows/interop.yml"
      - "xtask/**"
      - "crates/cos/**"
      - "crates/crypt/**"
      - "crates/engine/**"
      - "crates/automation/**"
      - "crates/oracle/**"
  workflow_dispatch:

# The token is only used to check out the code: no job writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interop:
    name: interop (MuPDF, Poppler)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the readers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mupdf-tools poppler-utils
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: interop
      # A missing reader fails the job here instead of printing a skip that reads as a pass.
      - name: Open every output in every reader
        env:
          PDFCRAFT_ORACLES_REQUIRED: "1"
        run: |
          status=0
          result=$(cargo xtask interop) || status=$?
          printf '%s\n' "$result"
          { echo '```'; printf '%s\n' "$result"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload the result and the files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop
          path: target/interop
          if-no-files-found: ignore
