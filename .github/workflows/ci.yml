name: CI

# Isolated branch-only validation of the Windows CLI owner-token regression.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/verify/pdfcraft-8177-windows-owner-token'
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@1d1155edbf734eca3a7e94566cc8cdcd30d4f036
    with:
      os: '["windows-latest"]'
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      tools: cargo-nextest@0.9.150,cargo-deny@0.20.2
      windows-env: PDFCRAFT_REQUIRE_WINRES=1
      timeout-minutes: 90
      windows-command: |
        log="$(mktemp)"
        trap 'rm -f "$log"' EXIT
        cargo test --locked -p pdfcraft-cli --test it ui_control::a_token_file_of_your_own_reaches_the_app -- --exact --color never | tee "$log"
        grep -F 'test ui_control::a_token_file_of_your_own_reaches_the_app ... ok' "$log"
        grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log"
