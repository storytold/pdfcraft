name: Android CI

on:
  push:
    branches:
      - android-port
      - android/development
      - "feature/android-*"
  pull_request:
    branches:
      - android-port
      - android/development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-and-test:
    name: Build and test Android
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          rustc --version
          cargo --version

      - name: Install cargo-ndk and Android SDK packages
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-37.0" >/dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          [ -d "$ANDROID_HOME/platforms/android-37" ] || ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Cache Cargo and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-android-${{ hashFiles('Cargo.lock', 'apps/pdfcraft-android/android/gradle/wrapper/gradle-wrapper.properties', 'apps/pdfcraft-android/android/gradle.properties', 'apps/pdfcraft-android/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-android-

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Clippy linter
        run: cargo clippy -p pdfcraft-android -p pdfcraft-annot -p pdfcraft-automation --tests --locked -- -D warnings

      - name: Verify asset policy
        run: cargo xtask assets

      - name: Run Android bridge tests
        run: cargo test --locked -p pdfcraft-android

      - name: Run automation tests
        run: cargo test --locked -p pdfcraft-automation

      - name: Run annotation tests
        run: cargo test --locked -p pdfcraft-annot

      - name: Run Android JVM unit tests
        working-directory: apps/pdfcraft-android/android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble Android instrumentation tests
        working-directory: apps/pdfcraft-android/android
        run: ./gradlew --no-daemon assembleAndroidTest

      - name: Assemble debug APK
        working-directory: apps/pdfcraft-android/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble release APK and AAB for build validation
        working-directory: apps/pdfcraft-android/android
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-android-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/pdfcraft-android/android/app/build/outputs/apk/debug/*.apk
            apps/pdfcraft-android/android/app/build/outputs/apk/release/*.apk
            apps/pdfcraft-android/android/app/build/outputs/bundle/release/*.aab
            apps/pdfcraft-android/android/app/build/outputs/apk/androidTest/debug/*.apk
