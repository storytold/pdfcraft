[package]
edition = "2024"
rust-version = "1.92"
name = "hayro-interpret"
version = "0.7.0"
authors = ["Laurenz Stampfl <laurenz.stampfl@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
