[dependencies.hayro-syntax]
version = "0.7.0"
features = [
    "std",
    "images",
    "unsafe",
]
default-features = false

[dependencies.kurbo]
version = "0.13.0"

[dependencies.log]
version = "0.4"
optional = true

[dependencies.moxcms]
version = "0.8.1"

[dependencies.phf]
version = "0.13.1"
features = ["macros"]
