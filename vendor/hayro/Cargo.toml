[package]
edition = "2024"
rust-version = "1.92"
name = "hayro"
version = "0.7.1"
authors = ["Laurenz Stampfl <laurenz.stampfl@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A rasterizer for PDF files."
readme = "README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/LaurenzV/hayro"
resolver = "2"

[features]
default = [
    "embed-fonts",
    "embed-cmaps",
]
embed-cmaps = ["hayro-interpret/embed-cmaps"]
embed-fonts = ["hayro-interpret/embed-fonts"]
logging = ["hayro-interpret/logging"]

[lib]
name = "hayro"
path = "src/lib.rs"

[[example]]
name = "render"
path = "examples/render.rs"

[dependencies.bytemuck]
version = "1"
features = ["bytemuck_derive"]

[dependencies.hayro-interpret]
version = "0.7.0"
default-features = false

[dependencies.image]
version = "0.25"
features = ["png"]
default-features = false

[dependencies.kurbo]
version = "0.13.0"

# PdfCraft patch: report image resampling fallbacks through the application's logger.
[dependencies.log]
version = "0.4"

[dependencies.pic-scale]
version = "0.7.9"
features = [
    "neon",
    "rdm",
    "sse",
    "avx",
]
default-features = false

[dependencies.vello_cpu]
version = "0.0.8"
features = [
    "std",
    "png",
    "u8_pipeline",
]
default-features = false

[dev-dependencies.log]
version = "0.4"

[lints.clippy]
collection_is_never_read = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
default_trait_access = "warn"
doc_markdown = "warn"
