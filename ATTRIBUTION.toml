# ATTRIBUTION.toml: one entry per asset (clean-room.md and licences.md). The source of truth for provenance and licences.
# ATTRIBUTION.md is generated from this file: `cargo xtask assets --write`. Checked by `cargo xtask assets` (part of `xtask ci`).
#
# [[asset]]    a file in this repository (committed or vendored); `sha256` must match the file.
# [[bundled]]  a file compiled into PdfCraft by a Cargo dependency (its crate version must match Cargo.lock).
# [[fetched]]  downloaded at build time by xtask (never committed), pinned by `sha256`.
# [[build_input]] an optional build input outside this repository (craft-fonts via CRAFT_FONTS_DIR, craft-i18n via CRAFT_I18N_DIR);
#              never committed or downloaded here, its own repository attributes each file.
#
# licence: SPDX expression from the allowlist in licences.md. adobe_data = true marks the closed list of
# Adobe-authored non-visual technical data allowed by clean-room.md.

