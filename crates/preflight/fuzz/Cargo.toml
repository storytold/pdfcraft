[package]
name = "pdfcraft-preflight-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Detached from the PdfCraft workspace: run with `cargo +nightly fuzz run verify`
# from crates/preflight/.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
pdfcraft-cos = { path = "../../cos" }
pdfcraft-preflight = { path = ".." }

[[bin]]
name = "verify"
path = "fuzz_targets/verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "convert"
path = "fuzz_targets/convert.rs"
test = false
doc = false
bench = false
