pdfcraft-filters = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
pdfcraft-testkit = { workspace = true }
# Test fixtures: a DCTDecode image is built with the JPEG encoder.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
