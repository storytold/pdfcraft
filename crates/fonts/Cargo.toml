[package]
name = "pdfcraft-fonts"
description = "Font metrics and text encoding helpers for generated appearances (standard fonts, WinAnsi)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
# Glyph outlines of the bundled script font (typed signatures); already in the tree via egui.
skrifa = "0.44"
# Arabic shaping for text written into PDFs; already in the tree via egui, on the same read-fonts.
harfrust = "0.12"
unicode-bidi = "0.3"
# The predefined CMaps (GB-EUC-H, GBpc-EUC-H, ETen-B5-H, …) with their CID tables, so a
# composite font that names its encoding instead of embedding it still maps codes to Unicode.
hayro-cmap = { path = "../../vendor/hayro-cmap" }
