[package]
name = "pdfcraft-create"
description = "Create PDFs: blank documents, from images (PNG, JPEG) and from plain text"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-filters = { workspace = true }
pdfcraft-model = { workspace = true }
pdfcraft-fonts = { workspace = true }
# For `image::bmp_with_pixel_offset`, shared with XFA pictures.
pdfcraft-xfa = { workspace = true }
craft-image-codecs = { workspace = true }
craft-jpeg = { workspace = true }
craft-tiff = { workspace = true }
# Keep `image` (no codec features) only for `imageops::resize` of soft masks in `extract.rs`.
image = { version = "0.25", default-features = false }
thiserror = { workspace = true }
# Already in the graph through lopdf; used only to read plain-text files (decode_text).
encoding_rs = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-opc.workspace = true
gridcraft-xlsx = { path = "../../vendor/gridcraft/crates/xlsx" }
serde_json.workspace = true
gridcraft-engine = { path = "../../vendor/gridcraft/crates/engine" }
deckcraft-format = { path = "../../vendor/deckcraft/crates/format" }
deckcraft-pdf = { path = "../../vendor/deckcraft/crates/pdf" }
deckcraft-ppt = { path = "../../vendor/deckcraft/crates/ppt" }
deckcraft-pptx = { path = "../../vendor/deckcraft/crates/pptx" }
wordcraft-engine = { path = "../../vendor/wordcraft/crates/engine" }
wordcraft-formats = { path = "../../vendor/wordcraft/crates/formats" }


[dev-dependencies]
craft-doc-binary = { git = "https://github.com/storytold/craft-libs", rev = "0a6e42b80bfd586aee6ee1144aa98cf1ea37a844" }
craft-docx.workspace = true
# An independent CCITT decoder, to check Create PDF's Group 4 images.
hayro-ccitt.workspace = true
hayro-syntax = { workspace = true }
pdfcraft-filters = { workspace = true }
