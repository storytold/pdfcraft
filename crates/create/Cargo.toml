[package]
name = "pdfcraft-create"
description = "Create PDFs: blank documents, from images (PNG, JPEG) and from plain text"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-model = { workspace = true }
pdfcraft-fonts = { workspace = true }
png = "0.18"
tiff = "0.11"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg"] }
# Already in the graph through image; read directly for CMYK JPEG samples, which image converts to RGB.
zune-jpeg = "0.5"
thiserror = { workspace = true }
# Already in the graph through lopdf; used only to read plain-text files (decode_text).
encoding_rs = "0.8"
# EPUB books (from_epub): the container, its XML, line breaking (UAX #14), bidi (UAX #9), shaping
# and font metrics, font de-obfuscation, SVG pictures (drawn without text, so no system font is used).
flate2 = { workspace = true }
roxmltree = "0.20"
percent-encoding = "2.3"
unicode-linebreak = "0.1.5"
unicode-bidi = "0.3"
harfrust = "0.12"
skrifa = "0.44"
sha1 = "0.10"
resvg = { version = "0.45", default-features = false }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg"] }
hayro-syntax = { workspace = true }
