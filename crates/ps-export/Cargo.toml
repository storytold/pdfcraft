[package]
name = "pdfcraft-ps-export"
description = "PostScript and EPS export for PdfCraft"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
hayro = { workspace = true }
kurbo = { workspace = true }
pdfcraft-filters = { workspace = true }
# The font resolver the raster renderer configures its page drives with (the craft-fonts
# Japanese fallback over the standard-14 substitutes): export reuses it so glyph
# substitution matches `page_render` by construction (spec D3). Every consumer of this
# crate already depends on pdfcraft-render, so this adds no crate to any binary.
pdfcraft-render = { workspace = true }
# Parses embedded Type 1 font programs for their glyph-name table; the same skrifa
# hayro-interpret uses (same version, so glyph ids match by construction).
skrifa = "0.47"
# SHA-256 of embedded Type 1 programs — the font prolog's dedup key (the same
# pin crypt, sign, xfa and automation carry).
sha2 = "0.11"

[dev-dependencies]
# The oracle tests: the exporter's output is rasterized by Ghostscript and compared with
# PdfCraft's own raster of the source PDF at the same dpi.
png = "0.18"
# Encodes the JPEG image fixture at test time (contributor-generated bytes only).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Checks the Japanese-fallback resolver against the craft-fonts faces (skips without them).
pdfcraft-fonts = { workspace = true }
