[package]
name = "pdfcraft-ps-export"
description = "PostScript and EPS export for PdfCraft"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
hayro = { workspace = true }
kurbo = { workspace = true }
pdfcraft-filters = { workspace = true }
# Parses embedded Type 1 font programs for their glyph-name table; the same skrifa
# hayro-interpret uses (same version, so glyph ids match by construction).
skrifa = "0.47"

[dev-dependencies]
# The oracle tests: the exporter's output is rasterized by Ghostscript and compared with
# PdfCraft's own raster of the source PDF at the same dpi.
pdfcraft-render = { workspace = true }
png = "0.18"
# Encodes the JPEG image fixture at test time (contributor-generated bytes only).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
