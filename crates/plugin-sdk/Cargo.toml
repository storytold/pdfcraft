[package]
name = "pdfcraft-plugin-sdk"
description = "Guest SDK for PdfCraft WebAssembly plugins (protocol API 1)"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Deliberately outside the PdfCraft workspace: plugins are independent
# crates, built for wasm32-unknown-unknown and released on their own.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

base64 = "0.22"
