[package]
name = "pdfcraft-ocr"
description = "Scan & OCR: recognise text in page images (ocrs) and write it as an invisible, searchable text layer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-fonts = { workspace = true }
# `rten` loads both model formats: ONNX (current) and RTEN (legacy fallback in `Models::in_dir`).
ocrs = { version = "0.13.1", default-features = false, features = ["rten"] }
rten = { version = "0.26.0", default-features = false, features = ["onnx_format", "rten_format"] }
thiserror.workspace = true

# `tempfile` is gone: the merged tests use their own `ScratchDir` guard.
