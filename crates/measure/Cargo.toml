[package]
name = "pdfcraft-measure"
description = "Calibrated 2D PDF measurements, viewports and snapping"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-model = { workspace = true }
pdfcraft-content = { workspace = true }
pdfcraft-annot = { workspace = true }
pdfcraft-fonts = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

# Pure Rust projection and ellipsoidal geodesic engines; no native PROJ dependency.
proj-core = { version = "=0.11.0", default-features = false }
proj-wkt = "=0.11.0"
geographiclib-rs = "=0.2.7"
