[package]
name = "pdfcraft-automation"
description = "Agent control for PdfCraft: a headless tool set over the engine and an MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-engine = { workspace = true, default-features = false }
pdfcraft-cos = { workspace = true }
pdfcraft-render = { workspace = true }
pdfcraft-organize = { workspace = true }
pdfcraft-platform = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = "3.27"
base64 = { version = "0.23", optional = true }


[features]
default = ["mcp", "full-engine"]
full-engine = [
    "pdfcraft-engine/ocr",
    "pdfcraft-engine/sign",
    "pdfcraft-engine/xfa",
    "pdfcraft-engine/js",
    "pdfcraft-engine/preflight",
]
ocr = ["pdfcraft-engine/ocr"]
sign = ["pdfcraft-engine/sign"]
xfa = ["pdfcraft-engine/xfa"]
js = ["pdfcraft-engine/js"]
preflight = ["pdfcraft-engine/preflight"]
# The MCP server module. Opt-in at run time either way; disable to leave it out of the build.
mcp = ["dep:base64"]

[dev-dependencies]
pdfcraft-fonts = { workspace = true }
png = "0.18"
flate2.workspace = true
pdfcraft-model = { workspace = true }
pdfcraft-xfa = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }
