[package]
name = "pdfcraft-export"
description = "Export a PDF to HTML, Word (.docx), Excel (.xlsx), PowerPoint (.pptx) and RTF from its paragraphs and images"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
craft-markdown.workspace = true
craft-mime.workspace = true
craft-rtf = { workspace = true, features = ["doc"] }
craft-wordmodel.workspace = true
craft-docx.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
craft-pptx.workspace = true
craft-xml.workspace = true
craft-zip.workspace = true

[dev-dependencies]
flate2.workspace = true
# Reads the Excel export back in tests, as another program would.
calamine = { version = "0.38.0", default-features = false }
