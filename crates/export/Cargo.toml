[package]
name = "pdfcraft-export"
description = "Export a PDF to HTML, Word (.docx) and RTF from its paragraphs and images"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
craft-markdown.workspace = true
craft-mime.workspace = true
craft-rtf = { workspace = true, features = ["doc"] }
craft-wordmodel.workspace = true
craft-docx.workspace = true
craft-html = { git = "https://github.com/KenM76/craft-libs", rev = "21d667ce60922b9b44e33b4f42a83107b3ede616", version = "0.1.0", features = ["standalone"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
craft-pptx.workspace = true
craft-xml.workspace = true
craft-zip.workspace = true

[dev-dependencies]
flate2.workspace = true
