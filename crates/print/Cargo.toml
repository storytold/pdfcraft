[package]
name = "pdfcraft-print"
description = "Printing: page selection, sizing (fit, actual, shrink, custom), multiple pages per sheet, booklets, posters, comments & forms; print-ready PDF and the system spooler"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-print = { workspace = true }
pdfcraft-cos = { workspace = true }
pdfcraft-content = { workspace = true }
pdfcraft-model = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
pdfcraft-render = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Same safe D-Bus/runtime crates already used by platform; no Tokio runtime or toolkit.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
futures-lite = "2"
async-io = "2"
tempfile = "3"
