[package]
name = "pdfcraft-annot"
description = "Annotations (comments): builders, appearance streams and edits, ISO 32000-2 §12.5"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-fonts = { workspace = true }
pdfcraft-model = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
hayro-syntax = { workspace = true }
# Property tests over generated annotation geometry and metadata (`tests/properties.rs`). Same
# workspace dependency the sibling test suites already carry: `crates/cos/Cargo.toml` declares it as
# `proptest = { workspace = true }`, and `crates/crypt`/`crates/filters` use the dotted form
# `proptest.workspace = true`. Nothing new enters the dependency graph.
proptest = { workspace = true }
