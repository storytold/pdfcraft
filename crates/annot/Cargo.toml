[package]
name = "pdfcraft-annot"
description = "Annotations (comments): builders, appearance streams and edits, ISO 32000-2 §12.5"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-fonts = { workspace = true }
# The usable-quad rule `/QuadPoints` readers share.
pdfcraft-geom = { workspace = true }
pdfcraft-model = { workspace = true }
thiserror = { workspace = true }
# NFC normalisation for comment and text-box text in decomposed form (NFD).
unicode-normalization = "0.1"

[dev-dependencies]
hayro-syntax = { workspace = true }
