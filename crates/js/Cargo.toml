[package]
name = "pdfcraft-js"
description = "Acrobat JavaScript: a sandboxed interpreter (boa) with the form object model subset (event, getField, app, util, console)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b"] }
# FormCalc Date/Num2Date calendar conversion goes through chrono (no hand-rolled calendar code);
# std-only, so it stays wasm-safe.
chrono = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b", "js"] }
