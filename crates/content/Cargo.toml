[package]
name = "pdfcraft-content"
description = "Content streams (ISO 32000-2 §7.8, §8–9): operators with source spans, inline images, serializer, matrices"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# The parser and serializer live in craft-pdf's `content` feature. The workspace patch points its
# hayro-syntax at vendor/hayro-syntax, so inline images end where the renderer ends them.
craft-pdf = { workspace = true, features = ["content"] }

[dev-dependencies]
hayro-syntax = { workspace = true }
