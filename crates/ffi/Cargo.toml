[package]
name = "pdfcraft-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
full = ["js", "ocr", "xfa", "sign", "export", "preflight"]
js = []
ocr = []
xfa = []
sign = []
export = []
preflight = []
cli = ["uniffi/cli"]

[dependencies]
pdfcraft-engine = { path = "../engine", version = "0.8.0" }
pdfcraft-render = { path = "../render", version = "0.8.0" }
pdfcraft-automation = { path = "../automation", version = "0.8.0", default-features = false }
pdfcraft-model = { path = "../model", version = "0.8.0" }
pdfcraft-cos = { path = "../cos", version = "0.8.0" }
pdfcraft-geom = { path = "../geom", version = "0.8.0" }
pdfcraft-fonts = { path = "../fonts", version = "0.8.0" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uniffi = { version = "0.32.2", default-features = false }

[target.'cfg(any(target_vendor = "apple", target_os = "android"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
