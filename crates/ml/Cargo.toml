[package]
name = "pdfcraft-ml"
description = "Machine-learning inference on the GPU (wgpu compute shaders), for the OCR models read from ONNX"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# The wgpu compute path. Native targets only; without it the crate is empty.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:half", "dep:rten-onnx", "dep:thiserror"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# All already in the tree: wgpu through egui-wgpu, rten-onnx through rten's onnx_format.
wgpu = { version = "30", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }
half = { version = "2", optional = true }
rten-onnx = { version = "0.26.0", optional = true }
thiserror = { workspace = true, optional = true }
