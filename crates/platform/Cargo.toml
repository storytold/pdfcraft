[package]
name = "pdfcraft-platform"
description = "Operating-system services shared by the PdfCraft desktop app and automation tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Administrators' policy file on Linux and the BSDs (policy.rs).
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Administrators' policies in HKLM and HKCU\SOFTWARE\Policies (policy.rs): safe wrappers over
# the registry API. Already in the tree with this feature through the desktop app.
winsafe = { version = "0.0.29", default-features = false, features = ["advapi"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Administrators' policies as managed preferences (policy.rs): CFPreferences' safe bindings.
# Already in the tree through winit and wgpu.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFNumber", "CFPreferences", "CFPropertyList", "CFString"] }
# `write_atomically`: a volume that refuses F_FULLFSYNC gets a plain fsync.
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the dependency graph through the accessibility integration. The portal watcher
# uses the async API so dropping it can cancel an idle subscription without polling.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
async-channel = "2"
futures-lite = "2"

[dev-dependencies]
# Exercise the actual portal wire decoder and cancellable worker on every native test host.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
async-channel = "2"
futures-lite = "2"
