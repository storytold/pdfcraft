[package]
name = "pdfcraft-platform"
description = "Operating-system services shared by the PdfCraft desktop app and automation tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde_json.workspace = true
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"
base64 = "0.23"

[target.'cfg(unix)'.dependencies]
os_pipe = "1"
command-fds = "=0.3.3"
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Safe exact-handle inheritance and kill-on-close process jobs for the browser's private pipes.
win-custody = "=0.1.2"

[target.'cfg(target_os = "macos")'.dependencies]
# `write_atomically`: a volume that refuses F_FULLFSYNC gets a plain fsync.
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the dependency graph through the accessibility integration. The portal watcher
# uses the async API so dropping it can cancel an idle subscription without polling.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
async-channel = "2"
futures-lite = "2"

[dev-dependencies]
# Exercise the actual portal wire decoder and cancellable worker on every native test host.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
async-channel = "2"
futures-lite = "2"
