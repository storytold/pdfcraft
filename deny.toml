# cargo-deny policy (M0.4). Run with `cargo xtask deny`; part of `cargo xtask ci`.
# Code dependencies follow the same rule as assets (AGENTS.md and standards/licences.md).
# Copyleft (GPL, AGPL, LGPL) is never linked; such tools run only as external oracle processes.
# MPL-2.0 is allowed for third-party crates used unmodified (file-level copyleft; licences.md).

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "IJG",
    "MPL-2.0",
    # Permissive data licence of the certificate bundle in webpki-roots (rustls' roots via ureq).
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Shared UI, PDF components and spooler; Cargo.toml pins immutable revisions. craft-print pins
# storytold's winprint fork (Windows printing, #1107) to an immutable revision of its own.
allow-git = [
    "https://github.com/storytold/craft-libs",
    "https://github.com/storytold/winprint.rs",
    # The reviewed egui 0.37 and winit 0.30.13 fork revisions (immutable pins in Cargo.toml).
    "https://github.com/storytold/egui",
    "https://github.com/storytold/winit",
]
# The framework crates reach vectorcraft (craft-svg's geometry and path ops) from the same
# organisation, pinned by revision in Cargo.lock; any storytold repository is a first-party source.
allow-org = { github = ["storytold"] }

[advisories]
yanked = "deny"
ignore = [
    # Marvin (RSA private-key timing side channel, no fixed `rsa` release). pdfcraft-sign uses
    # `rsa` only for public-key signature verification, which the advisory does not affect; RSA
    # private-key operations use aws-lc-rs on native targets and are refused in the browser
    # (ADR-0009). Revisit when a fixed `rsa` ships.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used for verification only (ADR-0009)" },
    # proc-macro-error is unmaintained (no vulnerability). It reaches the tree as a proc macro of
    # winprint's fmt-derive (craft-print's Windows spooler), so it runs at compile time on Windows
    # and is not in the binary.
    { id = "RUSTSEC-2024-0370", reason = "compile-time proc macro of winprint's fmt-derive (craft-print Windows printing, #1107)" },
    # zvariant, zbus_names and zvariant_derive are unmaintained (no vulnerability, and no fixed
    # release to move to). They reach the tree as the D-Bus stack behind `accesskit_unix` ->
    # `atspi`, which is Linux accessibility only, and as a dev-dependency of pdfcraft-platform.
    # Revisit when the accesskit/zbus chain moves to a maintained successor.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; Linux a11y stack via accesskit_unix" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; Linux a11y stack via accesskit_unix" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; Linux a11y stack via accesskit_unix" },
    # chrono is unmaintained (no vulnerability, every version affected, no release to move to).
    # The Rust house rules require time to go through chrono, and craft-libs (craft-pdf,
    # craft-pkcs7, craft-mime, craft-update) depend on it, so a successor is chosen in
    # craft-contrib's standards/house-rules-rust.md first. Revisit when that names one (#7647).
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; required by the Rust house rules and craft-libs (#7647)" },
]

# egui's default UI fonts (Ubuntu-Light, Hack, emoji-icon-font): font licences on the AGENTS.md
# licences.md allowlist, attributed in ATTRIBUTION.toml as dependency-bundled assets.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# winprint (craft-print's Windows spooler, #1107) lists reqwest as a build-dependency for its
# PDFium download, which only runs with its `pdfium` feature; craft-print turns that off. The CA
# bundle reqwest brings is CDLA-Permissive-2.0 data and is compiled into winprint's build script
# only, never into PdfCraft. Remove when winprint makes those build-dependencies optional.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]
